name: Update airline route data
on: 
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Test scraper
        run: uv run --python 3.10 --with-requirements requirements.txt -- python -m unittest discover -v
      - name: Scrape and commit
        env:
          FLIGHTSFROM_PROXY: ${{ secrets.FLIGHTSFROM_PROXY }}
        run: |
          uv run --python 3.10 --with-requirements requirements.txt -- python -u scrape_airline_routes.py

          git config --global user.email "bot@jonty.co.uk"
          git config --global user.name "Airline Route Update GHA"

          git add airline_routes.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatic airline route update"
          fi
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
